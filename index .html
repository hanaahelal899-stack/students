<!DOCTYPE html>
<html>
    <head>
        <title>المصفوفات</title>
    
    </head>
    <body>
<script>
        const students = [
        {id: 1, average: 85},
        {id: 2, average : 42},
        {id: 3, average : 90},
        {id: 4 ,average : 48}
        ];
        const struggingstudents = students.filter(s => s.average >= 40 && s.average <= 49);
        const upgradedgrades =struggingstudents. map (s => s.average + 5);
        const totalupgraded =upgradedgrades . reduce (( sum , grade) => sum + grade,0);
        let upgradedaverage = 0;
        if ( struggingstudents > 0){
            upgradedaverage = totalupgraded /struggingstudents.length;
        }
console.log (" متوسط درجات الطلاب بعد الرافه",upgradedaverage);
        </script>
    </body>
</html>
